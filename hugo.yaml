locale: "en-us"

# We ship our own static/robots.txt, so Hugo should not generate one.
enableRobotsTXT: false

# No tag or category pages: they would be empty and would show up in the
# sitemap as dead ends.
disableKinds: ["taxonomy", "term"]

params:
