<nav class="site-nav" id="site-nav" aria-label="Main">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="{{ "/" | relURL }}">{{ site.Params.author }}</a>

    <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-menu">
      <span class="site-nav-toggle-box" aria-hidden="true">
        <span class="site-nav-toggle-bar"></span>
        <span class="site-nav-toggle-bar"></span>
        <span class="site-nav-toggle-bar"></span>
      </span>
      <span class="visually-hidden">Menu</span>
    </button>

    <ul class="site-nav-menu" id="site-nav-menu">
      {{- range site.Menus.main }}
      {{- $external := or (strings.HasPrefix .URL "http") (strings.HasSuffix .URL ".pdf") }}
      <li>
        <a href="{{ .URL | relURL }}"{{ if $external }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      </li>
      {{- end }}
    </ul>
  </div>
</nav>

<noscript>
  <style>
    @media (max-width: 768px) {
      .site-nav-toggle { display: none; }
      .site-nav-menu {
        display: flex !important;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        padding-top: 0.5rem;
      }
    }
  </style>
</noscript>

<script>
  (function () {
    var nav = document.getElementById('site-nav');
    var toggle = nav && nav.querySelector('.site-nav-toggle');
    if (!nav || !toggle) return;
    toggle.addEventListener('click', function () {
      var open = nav.getAttribute('data-open') === 'true';
      nav.setAttribute('data-open', open ? 'false' : 'true');
      toggle.setAttribute('aria-expanded', open ? 'false' : 'true');
    });
    nav.querySelectorAll('.site-nav-menu a').forEach(function (link) {
      link.addEventListener('click', function () {
        nav.setAttribute('data-open', 'false');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
